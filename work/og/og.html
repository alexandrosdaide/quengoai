<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:630px;overflow:hidden;font-family:Inter,sans-serif}
.og{position:relative;width:1200px;height:630px;background:radial-gradient(700px 520px at 18% 30%,#1E3D2C 0%,#12261C 55%,#0B1912 100%);overflow:hidden}
.anh{position:absolute;right:0;top:0;width:560px;height:630px;overflow:hidden}
.anh img{width:540px;height:680px;object-fit:cover;object-position:center 40%;display:block;margin-top:-25px}
.anh::before{content:"";position:absolute;inset:0;z-index:1;background:linear-gradient(90deg,#12261C 0%,rgba(18,38,28,.92) 10%,rgba(18,38,28,.55) 26%,rgba(18,38,28,.18) 44%,rgba(18,38,28,0) 60%),linear-gradient(0deg,rgba(11,25,18,.55),transparent 30%)}
.khung{position:absolute;inset:22px;border:1.5px solid rgba(214,181,112,.55);border-radius:6px;z-index:3;pointer-events:none}
.khung::after{content:"";position:absolute;inset:6px;border:.8px solid rgba(214,181,112,.28);border-radius:3px}
.la{position:absolute;left:-60px;bottom:-70px;width:330px;opacity:.10;z-index:1}
.noi{position:absolute;z-index:2;left:78px;top:0;bottom:0;width:640px;display:flex;flex-direction:column;justify-content:center}
.logo{width:500px;margin-left:-6px}
.vach{display:flex;align-items:center;gap:12px;margin:26px 0 22px;color:#D6B570}
.vach i{height:1px;width:64px;background:linear-gradient(90deg,transparent,#D6B570)}
.vach i:last-child{background:linear-gradient(90deg,#D6B570,transparent)}
.vach b{width:7px;height:7px;transform:rotate(45deg);border:1.3px solid #D6B570}
h1{font:500 40px/1.2 Lora,serif;color:#F6EEDA;letter-spacing:.2px}
h1 em{font-style:italic;color:#E9D29A}
p{margin-top:12px;font:400 21px/1.45 Inter;color:#CFC6AE}
.chip{display:flex;gap:10px;margin-top:26px}
.chip span{font:600 17px Inter;color:#12261C;background:linear-gradient(180deg,#F0DCA8,#C9A25A);padding:9px 18px;border-radius:99px}
.chip span.vien{background:none;color:#E9D29A;border:1.3px solid rgba(233,210,154,.6)}
</style></head><body><div class="og" id="og">
<svg class="la" viewBox="0 0 100 100" fill="none" stroke="#E9D29A" stroke-width="1.2"><path d="M50 98 C51 70 50 50 50 30"/><path d="M50 32 Q30 30 8 52 Q30 24 50 32Z"/><path d="M50 32 Q30 14 18 12 Q38 6 50 32Z"/><path d="M50 32 Q44 10 46 2 Q54 12 50 32Z"/><path d="M50 32 Q62 8 80 6 Q66 18 50 32Z"/><path d="M50 32 Q72 26 94 46 Q70 34 50 32Z"/></svg>
<div class="anh"><img src="anh-chai.jpg"></div>
<div class="khung"></div>
<div class="noi">
 <img class="logo" src="../../img/logo-vang.svg">
 <div class="vach"><i></i><b></b><i></i></div>
 <h1>Rượu cau ngâm theo<br><em>công thức dân gian</em></h1>
 <p>Hỗ trợ chăm sóc răng miệng tại chỗ · Ngâm tại Nam Định</p>
 <div class="chip"><span>Miễn phí ship từ 2 chai</span><span class="vien">350ml · Plus 500ml</span></div>
</div>
</div></body></html>
