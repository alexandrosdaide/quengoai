<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
body{width:1200px;height:1600px;font-family:Inter,sans-serif}
.the{width:1200px;height:1600px;background:radial-gradient(900px 700px at 30% 15%,#1E3D2C,#12261C 60%,#0B1912);position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:20px}
.khung{position:absolute;inset:34px;border:2px solid rgba(214,181,112,.55);border-radius:10px}
.khung::after{content:"";position:absolute;inset:9px;border:1px solid rgba(214,181,112,.28);border-radius:5px}
.logo{width:600px}
.vach{display:flex;align-items:center;gap:16px;margin:34px 0 38px}
.vach i{height:1.5px;width:110px;background:linear-gradient(90deg,transparent,#D6B570)}
.vach i:last-child{background:linear-gradient(90deg,#D6B570,transparent)}
.vach b{width:11px;height:11px;transform:rotate(45deg);border:2px solid #D6B570}
.qr{background:#fff;padding:26px;border-radius:40px;box-shadow:0 30px 60px -30px rgba(0,0,0,.7),0 0 0 6px rgba(214,181,112,.5)}
.qr img{width:720px;height:720px;display:block}
h2{margin-top:54px;font:600 46px Lora,serif;color:#F6EEDA}
.web{margin-top:18px;font:700 42px Inter;letter-spacing:.5px;color:#12261C;background:linear-gradient(180deg,#F0DCA8,#C9A25A);padding:16px 44px;border-radius:99px}
</style></head><body><div class="the" id="the"><div class="khung"></div>
<img class="logo" src="../../img/logo-vang.svg">
<div class="vach"><i></i><b></b><i></i></div>
<div class="qr"><img src="qr-quengoai.svg"></div>
<h2>Quét mã để ghé thăm Quê Ngoại</h2>
<div class="web">quengoai.pages.dev/lp</div>
</div></body></html>
